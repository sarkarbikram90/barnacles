name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-vet:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Verify Formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  test-and-race:
    name: Tests & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run Benchmarks
        run: go test -bench=. -benchmem ./...

      - name: Run Parser Fuzz Smoke Tests
        run: |
          go test -run=^$ -fuzz=^FuzzJSONParser$ -fuzztime=2s -timeout=30s ./internal/parser
          go test -run=^$ -fuzz=^FuzzRegexpParser$ -fuzztime=2s -timeout=30s ./internal/parser
          go test -run=^$ -fuzz=^FuzzAutoParser$ -fuzztime=2s -timeout=30s ./internal/parser

  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true
          cache: true

      - name: Build Server Binary
        run: CGO_ENABLED=0 go build -v -o bin/barnacles-server ./cmd/barnacles-server

      - name: Build Agent Binary
        run: CGO_ENABLED=0 go build -v -o bin/barnacles-agent ./cmd/barnacles-agent
