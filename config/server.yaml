# Barnacles Server Configuration
server:
  address: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  max_body_bytes: 10485760 # 10MB
  web_dir: "./web"

auth:
  enabled: false
  tokens:
    - ${BARNACLES_AUTH_TOKEN:-secret-demo-token}

tls:
  enabled: false
  cert_file: ""
  key_file: ""

ingest:
  max_batch_events: 500
  max_message_bytes: 1048576 # 1MB
  dedup_window: 5m
  dedup_capacity: 50000

storage:
  directory: "./data/logs"
  sync_on_write: false

stream:
  recent_events: 10000
  max_clients: 100
  client_buffer_size: 256
  ping_interval: 30s
  write_deadline: 5s

retention:
  enabled: true
  max_size_gb: 10
  max_age_hours: 168 # 7 days
  check_interval: 10m
